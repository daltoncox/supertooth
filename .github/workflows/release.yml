name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qt_arch: gcc_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            qt_arch: gcc_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config git \
            libhackrf-dev libusb-1.0-0-dev \
            libcurl4-openssl-dev libncurses-dev \
            curl pkg-config \
            libgl1-mesa-dev libxcb*-dev libfontconfig1-dev \
            libxkbcommon-x11-dev libdbus-1-dev \
            libpulse-dev libsdl2-dev \
            python3-venv patchelf fakeroot

      - name: Build libbladeRF from source
        # Neither Ubuntu's libbladerf-dev (2.5.0) nor the Nuand PPA's 2024.07
        # snapshot reaches libbladeRF 2.6.0, which FX3 firmware v2.6.0's
        # larger USB framing requires; the old host stack then delivers 4x
        # the configured sample rate (all cores saturated, no packets
        # decoded). Build libbladeRF from source into the isolated
        # /opt/bladerf prefix (see packaging/build-bladerf-linux.sh).
        run: |
          sudo bash packaging/build-bladerf-linux.sh --prefix /opt/bladerf

      - name: Install Qt 6.8.0
        run: |
          python3 -m venv /tmp/qt-venv
          /tmp/qt-venv/bin/pip install requests py7zr
          /tmp/qt-venv/bin/python packaging/install-qt.py \
            --arch ${{ matrix.arch }} \
            --version 6.8.0 \
            --modules qtgraphs qtquick3d qtquicktimeline qtshadertools \
            --output /opt/Qt/6.8.0/${{ matrix.qt_arch }}

      - name: Configure
        # liquid-dsp is statically vendored via FetchContent (v1.8.3,
        # LOGGING_LEVEL=error); SUPERTOOTH_PORTABLE=ON suppresses AVX512/AMX
        # codegen (keeping AVX2 and below) so the release runs on AVX2-capable
        # x86-64 / NEON ARM hardware.
        run: |
          export PKG_CONFIG_PATH="/opt/bladerf/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="/opt/bladerf;/opt/Qt/6.8.0/${{ matrix.qt_arch }}" \
            -DBUILD_GUI=ON \
            -DENABLE_BLADERF=ON \
            -DSUPERTOOTH_PORTABLE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERTOOTH_VERSION=${{ github.ref_name }}

      - name: Build
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package Debian
        run: |
          bash packaging/bundle-deb.sh build \
            --arch ${{ matrix.arch }} \
            --version "${{ github.ref_name }}" \
            --qt-prefix /opt/Qt/6.8.0/${{ matrix.qt_arch }} \
            --output "./supertooth_linux_${{ matrix.arch }}.deb"

      - name: Upload .deb
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supertooth-deb-${{ matrix.arch }}
          path: ./*.deb

  build-macos-arm64:
    # Apple Silicon only. macos-latest is currently arm64; if GitHub moves it
    # to a different arch, pin back to an explicit arm64 runner (e.g. macos-15).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install --quiet cmake pkg-config hackrf libusb ncurses qt@6
          echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

      - name: Build libbladeRF from source
        # Same firmware-framing reason as the Linux job: Homebrew's libbladerf
        # bottle predates libbladeRF 2.6.0, which FX3 firmware v2.6.0
        # requires. Build from source into /opt/bladerf (see
        # packaging/build-bladerf-macos.sh); bundle-macos.sh vendors the
        # resulting dylib into the .dmg.
        run: |
          sudo bash packaging/build-bladerf-macos.sh --prefix /opt/bladerf

      - name: Configure
        # liquid-dsp is statically vendored via FetchContent (v1.8.3,
        # LOGGING_LEVEL=error); SUPERTOOTH_PORTABLE=ON suppresses AVX512/AMX
        # codegen (keeping AVX2 and below) for a portable release binary.
        run: |
          export PKG_CONFIG_PATH="/opt/bladerf/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="/opt/bladerf;$(brew --prefix qt@6)" \
            -DBUILD_GUI=ON \
            -DENABLE_BLADERF=ON \
            -DSUPERTOOTH_PORTABLE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERTOOTH_VERSION=${{ github.ref_name }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: |
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Package DMG
        run: |
          bash packaging/bundle-macos.sh build \
            --version "${{ github.ref_name }}" \
            --qt-prefix "$(brew --prefix qt@6)" \
            --output "./supertooth_macos_arm64.dmg"

      - name: Upload .dmg
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: supertooth-dmg-arm64
          path: ./*.dmg

  release:
    needs: [build-deb, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supertooth-deb-*
          path: release
          merge-multiple: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supertooth-dmg-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
