name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qt_arch: gcc_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            qt_arch: gcc_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libhackrf-dev libliquid-dev \
            libgl1-mesa-dev libxcb*-dev libfontconfig1-dev \
            libxkbcommon-x11-dev libdbus-1-dev \
            libpulse-dev libsdl2-dev \
            python3-venv patchelf fakeroot

      - name: Install Qt 6.8.0
        run: |
          python3 -m venv /tmp/qt-venv
          /tmp/qt-venv/bin/pip install requests py7zr
          /tmp/qt-venv/bin/python packaging/install-qt.py \
            --arch ${{ matrix.arch }} \
            --version 6.8.0 \
            --modules qtgraphs qtquick3d qtquicktimeline qtshadertools \
            --output /opt/Qt/6.8.0/${{ matrix.qt_arch }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH=/opt/Qt/6.8.0/${{ matrix.qt_arch }} \
            -DBUILD_GUI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERTOOTH_VERSION=${{ github.ref_name }}

      - name: Build
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package Debian
        run: |
          bash packaging/bundle-deb.sh build \
            --arch ${{ matrix.arch }} \
            --version "${{ github.ref_name }}" \
            --qt-prefix /opt/Qt/6.8.0/${{ matrix.qt_arch }} \
            --output "./supertooth_linux_${{ matrix.arch }}.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: supertooth-deb-${{ matrix.arch }}
          path: ./*.deb

  build-macos-arm64:
    # Apple Silicon only. macos-14 is an arm64 (M1) runner; do not switch to
    # macos-latest without confirming it is still arm64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake pkg-config hackrf liquid-dsp qt@6
          echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DBUILD_GUI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERTOOTH_VERSION=${{ github.ref_name }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: |
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Package DMG
        run: |
          bash packaging/bundle-macos.sh build \
            --version "${{ github.ref_name }}" \
            --qt-prefix "$(brew --prefix qt@6)" \
            --output "./supertooth_macos_arm64.dmg"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: supertooth-dmg-arm64
          path: ./*.dmg

  release:
    needs: [build-deb, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supertooth-deb-*
          path: release
          merge-multiple: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supertooth-dmg-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
