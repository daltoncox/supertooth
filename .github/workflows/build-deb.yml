name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qt_arch: gcc_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            qt_arch: gcc_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libhackrf-dev libliquid-dev \
            libgl1-mesa-dev libxcb*-dev libfontconfig1-dev \
            libxkbcommon-x11-dev libdbus-1-dev \
            libpulse-dev libsdl2-dev \
            python3-venv patchelf fakeroot

      - name: Install Qt 6.8.0
        run: |
          python3 -m venv /tmp/qt-venv
          /tmp/qt-venv/bin/pip install requests py7zr
          /tmp/qt-venv/bin/python packaging/install-qt.py \
            --arch ${{ matrix.arch }} \
            --version 6.8.0 \
            --modules qtgraphs qtquick3d qtquicktimeline qtshadertools \
            --output /opt/Qt/6.8.0/${{ matrix.qt_arch }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH=/opt/Qt/6.8.0/${{ matrix.qt_arch }} \
            -DBUILD_GUI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERTOOTH_VERSION=${{ github.ref_name }}

      - name: Build
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package Debian
        run: |
          bash packaging/bundle-deb.sh build \
            --arch ${{ matrix.arch }} \
            --version "${{ github.ref_name }}" \
            --qt-prefix /opt/Qt/6.8.0/${{ matrix.qt_arch }} \
            --output "./supertooth_${{ github.ref_name }}_${{ matrix.arch }}.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: supertooth-deb-${{ matrix.arch }}
          path: ./*.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supertooth-deb-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
